# Prometheus 配置文件 — SafetyMind 安全生产智能协同平台

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'safetymind'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # SafetyMind 主应用指标
  - job_name: 'safetymind-app'
    static_configs:
      - targets: ['safetymind:8000']
        labels:
          service: 'safetymind'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
